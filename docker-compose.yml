services:
  antispam-bot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cazaspam-bot
    restart: unless-stopped
    # Sin root y con un uid que no es de nadie en el host: si alguien escapara del
    # contenedor, no sería ningún usuario real. Ese uid tiene que poder escribir en
    # ./data y en ./config/blacklist/custom (ver README, «Instalación»).
    user: "${APP_UID:-10112}:${APP_GID:-10112}"
    env_file: .env
    environment:
      - TZ=Europe/Madrid
      - PYTHONUNBUFFERED=1
    volumes:
      - ./data:/app/data
      - ./src:/app/src:ro
      - ./scripts:/app/scripts:ro
      - ./config:/app/config:ro
      # Lo único de config/ que el bot escribe: las palabras que se añaden desde
      # Telegram. Con todo config/ en solo lectura, guardarlas fallaba.
      - ./config/blacklist/custom:/app/config/blacklist/custom
    healthcheck:
      # CMD-SHELL (17-oct-2026): la API de Podman parte por los espacios el código de un «CMD python -c …» y el
      # healthcheck fallaba siempre (unhealthy con el bot funcionando). En una sola cadena para sh -c, no.
      test: ["CMD-SHELL", "python -c \"import os,time; p='/app/data/heartbeat'; exit(0 if os.path.exists(p) and time.time()-os.path.getmtime(p)<300 else 1)\""]
      interval: 2m
      timeout: 10s
      retries: 3
      start_period: 1m
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - antispam-net

networks:
  antispam-net:
    driver: bridge
